<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Research Network - Drawing With Closure</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #fff; }
    .wrap {
      display: grid;
      grid-template-columns: minmax(320px, 560px) minmax(280px, 460px);
      gap: 2rem;
      align-items: start;
      margin-top: 1.8rem;
    }
    .article {
      max-width: 760px;
    }
    #draw-title {
      font-size: 1.72rem;
      margin-bottom: 0.75rem;
    }
    #draw-desc {
      font-size: 0.78rem;
      line-height: 1.62;
      color: #444;
      max-width: 700px;
    }
    #draw-canvas {
      width: 540px;
      height: 540px;
      max-width: 100%;
      display: block;
      background: #f8f8f8;
      border-radius: 4px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 1rem;
      justify-content: center;
    }
    .timeline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 0.85rem auto 0;
      max-width: 420px;
      font-size: 0.78rem;
      color: #777;
    }
    .timeline input {
      width: 100%;
      accent-color: #1a1a1a;
    }
    .resolution {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 0.55rem auto 0;
      max-width: 420px;
      font-size: 0.78rem;
      color: #777;
    }
    .resolution input {
      width: 100%;
      accent-color: #1a1a1a;
    }
    .btn {
      padding: 6px 14px;
      border: 1px solid #cfcfcf;
      background: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.84rem;
    }
    .btn.active,
    .btn:hover {
      color: white;
      background: #1a1a1a;
      border-color: #1a1a1a;
    }
    .panel h1 { font-size: 1.28rem; margin: 0 0 0.5rem; }
    .panel p { color: #444; font-size: 0.86rem; line-height: 1.5; }
    .readout {
      margin-top: 0;
      padding: 0.85rem;
      background: #f4f4f4;
      border-left: 2px solid #1a1a1a;
      font-family: monospace;
      font-size: 0.72rem;
      line-height: 1.55;
      white-space: pre-wrap;
      color: #222;
    }
    .label {
      margin: 1rem 0 0.35rem;
      font-size: 0.72rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    @media (max-width: 820px) {
      .wrap { grid-template-columns: 1fr; }
      #draw-canvas { width: 100%; height: 360px; }
    }
  </style>
</head>
<body>
<div id="site-nav-root"></div>
<script src="nav.js"></script>

<main>
  <div class="article">
    <h1 id="draw-title">Thought Engine</h1>
    <p id="draw-desc"></p>
  </div>

  <div class="wrap">
  <section>
    <canvas id="draw-canvas"></canvas>
    <div class="controls">
      <button class="btn active" id="restart">Restart</button>
      <button class="btn" id="toggle-play">Pause</button>
    </div>
    <div class="timeline">
      <input id="timeline" type="range" min="0" max="1000" value="0" />
      <span id="timeline-label">0%</span>
    </div>
    <div class="resolution">
      <span>edge</span>
      <input id="edge-resolution" type="range" min="4" max="48" value="24" />
      <span id="edge-resolution-label">24</span>
      <span>surface</span>
      <input id="face-resolution" type="range" min="6" max="32" value="18" />
      <span id="face-resolution-label">18</span>
    </div>
  </section>

  <section class="panel">
    <div id="draw-readout" class="readout">loading...</div>
  </section>
  </div>
</main>

<script src="draw.js"></script>
</body>
</html>
